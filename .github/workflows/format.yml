name: Source code formating check

on: [push, pull_request]

jobs:
   build:
      runs-on: ubuntu-latest
      steps:

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Update packages
        run: |
           sudo apt-get update 

      - name: Install packages
        run: |
           sudo apt-get -y install flex libfl-dev texlive-latex-base texlive-fonts-recommended texlive-latex-extra texlive-latex-recommended 

      - name: Build checkpd
        working-directory: Tools/pd
        run: make

      - name: Build checkusing
        working-directory: Tools/usingcheck
        run: make

      - name: Process all source files modified in the last 2 weeks
        run: |
          export PATH=$PATH:$GITHUB_WORKSPACE/Tools/usingcheck
          export PATH=$PATH:$GITHUB_WORKSPACE/Tools/pd
          export PD_HEADER=$GITHUB_WORKSPACE/Tools/pd/pd.header
          base_sha=$(git rev-list -1 --before="2 weeks ago" HEAD)
          if [ -z "$base_sha" ]; then
            echo "No commit found before 2 weeks ago; nothing to check"
            exit 0
          fi
          # We check just the files of the last 2 weeks, because we have non compliant code from
          # CVS times in the repository that just executed these checks on changed files.
          echo "Checking files changed since $base_sha"
          git diff --name-only --diff-filter=d "$base_sha" HEAD | while read -r file; do
            echo "$file was modified"
            if [[ $file == *.h ]] || [[ $file == *.hpp ]] || [[ $file == *.c ]] || [[ $file == *.cpp ]]; then
              ./Tools/usingcheck/usingcheck "$file"
              ./Tools/pd/checkpd --strong "$file"
            fi
          done


