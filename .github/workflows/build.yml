name: Build and test SECONDO

on:
  push:
    branches: [main]
  pull_request:

jobs:
   build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04', 'ubuntu-26.04']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.os }}
          max-size: 1G

      - name: Update packages
        run: |
          sudo apt-get update

      - name: Install packages
        run: |
          sudo apt-get -y install flex bison gcc g++ libdb5.3 libdb5.3-dev libdb5.3++ libdb5.3++-dev db5.3-util libjpeg-dev libgsl0-dev libreadline-dev librecode-dev libgmp-dev libncurses-dev libxml2-dev libboost-all-dev build-essential default-jdk wget swi-prolog-nox swi-prolog-java swi-prolog libquadmath0 libgmp-dev libgmp10 libboost-all-dev libbison-dev libfl-dev nlohmann-json3-dev

      - name: Detect SECONDO build environment
        run: |
          # The platform, Prolog paths, JDK and Berkeley DB are derived by
          # makefile.detect during the build itself, so only the compiler
          # override has to be put into the environment here.
          {
            echo "SECONDO_BUILD_DIR=${GITHUB_WORKSPACE}"
            echo "SECONDO_CC=ccache gcc"
            echo "SECONDO_CPP=ccache g++"
          } >> "$GITHUB_ENV"
          make -s -f makefile.detect print-vars
          make -f makefile.detect check-env

      - name: Show ccache statistics (before build)
        run: ccache -s

      - name: Build SECONDO
        run: |
          make -j $(nproc)

      - name: Show ccache statistics (after build)
        run: ccache -s

      # The C++ unit tests are not part of `make`, and run-tests.sh below only
      # drives the TTY level suites -- so nothing was exercising the nested list
      # storage layer directly. tnestedlist covers the atom types, CopyList and
      # the ToString round trip, and exits with its error count.
      - name: Test the nested list storage layer
        run: |
          make -C Tests tnestedlist
          Tests/tnestedlist

      # BigArray is what NestedList stores its tables in, and tnestedlist never
      # grows one far enough to leave its first chunk. tbigarray does, and
      # checks the invariant the class is built around: a chunk, once mapped,
      # is never moved -- which is what lets a reader dereference an element
      # while another thread appends.
      - name: Test the BigArray chunked storage
        run: |
          make -C Tests tbigarray
          Tests/tbigarray

      - name: Test SECONDO
        run: |
          cd CM-Scripts/; ./run-tests.sh -tty /tmp/secondotest 12000

      - name: Show failed test logs
        if: failure()
        run: |
          for f in "${GITHUB_WORKSPACE}"/bin/*.test.log; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done
          find /tmp/secondotest -type f 2>/dev/null | while read -r f; do
            echo "########## $f"; tail -80 "$f"
          done || true
          # TestClientServer runs from a mktemp -d and normally removes it, so
          # anything left here is from a run that was killed before its trap
          # could fire -- a hung shutdown. That leftover monitor.log names the
          # call the monitor or checkpoint service was wedged in, and it is the
          # one artifact that was missing when this last happened.
          for d in "${TMPDIR:-/tmp}"/TestClientServer.* /tmp/TestClientServer.*; do
            [ -d "$d" ] || continue
            find "$d" -type f 2>/dev/null | while read -r f; do
              echo "########## $f"; tail -80 "$f"
            done
          done || true
          # The daemons the monitor spawns log to their own cwd, which is bin/,
          # not to the test's temporary home -- so none of the loops above sees
          # them. Checkpoint.msg is the only record of what the checkpoint
          # service was doing when it ignored a shutdown request, and
          # server.msg/ holds the per-client server output.
          for f in "${GITHUB_WORKSPACE}"/bin/Checkpoint.msg \
                   "${GITHUB_WORKSPACE}"/bin/server.msg/*; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done || true

      # -----------------------------------------------------------------------
      # Web UI (WebUI/). Build the JS/Python components against the freshly
      # built kernel, then bring the whole stack up (SecondoMonitor + FastAPI
      # bridge) and confirm SECONDO answers a real query through the REST
      # interface. The headless-browser end-to-end tests (WebUI/frontend/e2e)
      # are intentionally NOT run here.
      # -----------------------------------------------------------------------
      - name: Build the SECONDO client library
        # The bridge's native module links libsecondo.a, which the top-level
        # make does not build.
        run: make -C apis/api_cpp/cs

      - name: Build the embedded SECONDO library
        run: make -C apis/api_cpp/direct

      # -----------------------------------------------------------------------
      # tnestedlist above drives one thread, and csloadtest's `parse` mode gives
      # every thread a NestedList of its own -- so nothing was covering several
      # threads on *one* list, which is what the running system actually does:
      # Distributed2 copies each worker's result into the global list
      # (ConnectionInfo::simpleCommand) and reads it back, and every Out
      # function an operator runs in a worker thread uses the global nl too.
      #
      # NestedList has no mutex any more, so this is the step that has to hold
      # the line: what makes concurrent use safe now is that BigArray never
      # moves a chunk once it is published and keeps its counters atomic, and
      # nothing but a test says so.
      #
      # The value checks catch corruption on their own. The accesses that race
      # without corrupting anything yet are ThreadSanitizer's to find, and it
      # runs over the whole tree in the build-linux-tsan job rather than here.
      #
      # --list-mem is what makes this reach the storage layer: it sizes the
      # tables to a single page, so BigArray runs out of room within the first
      # rounds and has to ftruncate and mremap while the other threads are
      # reading through the mapping it is moving. At the default sizes the
      # whole workload fits in the mapping made at construction and never grows
      # it once. The run prints how far the node table grew and fails if it did
      # not outgrow that first mapping, so this cannot lapse unnoticed.
      # -----------------------------------------------------------------------
      - name: Test concurrent access to one nested list
        working-directory: Tests/csloadtest
        timeout-minutes: 10
        run: |
          make
          ./app --mode shared --threads 8 --rounds 5 --list-mem 1

          # The other half of the contract -- "operations on the same list need
          # the caller's own lock" -- is the caller's to keep, so NestedList
          # ships a checker that turns breaking it into an immediate abort
          # naming both threads and the node. "make app-check" is that build:
          # NestedList.cpp and the test recompiled with -DNL_CHECK_CONCURRENCY
          # over the stock libsecondo.a. No sanitizer -- the checker is the
          # instrument, and it looks for overlap in time rather than for the
          # missing happens-before that TSan reports.
          #
          # Both directions are asserted, because a checker that never fires
          # and a checker that always fires both look like a passing build from
          # one side only.
          make app-check
          ./app-check --mode shared --threads 8 --rounds 5 --list-mem 1
          #
          # ...and one list passed from thread to thread, each one joined
          # before the next starts. That keeps the contract, so it has to run
          # clean -- and unlike the mode above it says so about a node that two
          # threads really did write, which is what a checker that marks a node
          # and forgets to unmark it gets wrong. Such a checker still aborts on
          # the unsynchronised mode below and still passes the mode above, so
          # this is the direction that has to be asserted separately.
          ./app-check --mode handover --threads 4 --rounds 5 --list-mem 1

          # What the contract run must produce is the checker's *report*, not
          # merely a non-zero exit: a crash, a binary that was never built, and
          # the mode refusing to run because -DNL_CHECK_CONCURRENCY never
          # reached the compiler all look alike from outside, and each of them
          # is a broken checker passing for a working one. That is not
          # hypothetical -- it is how a checker that had stopped detecting
          # anything kept this step green.
          fired=""
          for attempt in $(seq 1 10); do
            if out=$(./app-check --mode contract --threads 4 --rounds 1 \
                       --list-mem 1 2>&1); then
              echo "$out"
              echo "FAIL: the concurrency checker did not fire although four" \
                   "threads appended to one node without a lock"
              exit 1
            fi
            if echo "$out" | grep -q "NestedList threading contract was broken"
            then
              fired="yes"
              break
            fi
          done
          echo "$out"
          if [ -z "$fired" ]; then
            echo "FAIL: ten unsynchronised runs all died without the checker" \
                 "reporting once -- the last one is above"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: WebUI/frontend/package-lock.json

      - name: Build the WebUI frontend
        working-directory: WebUI/frontend
        run: |
          npm ci
          npm run build

      - name: Build and test the WebUI backend
        # Builds the pybind11 module over libsecondo.a and runs the backend
        # unit tests (which fake the SECONDO connection, so no monitor needed).
        working-directory: WebUI/backend
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          make -C native
          python -m pytest -q

      - name: Restore the berlintest database
        # A dedicated database home for the WebUI monitor, shared with the
        # following steps via $GITHUB_ENV.
        run: |
          echo "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
          echo "SECONDO_CONFIG=${GITHUB_WORKSPACE}/bin/SecondoConfig.ini" >> "$GITHUB_ENV"
          echo "SECONDO_PARAM_SecondoHome=${RUNNER_TEMP}/webui-dbs" >> "$GITHUB_ENV"
          export PATH="${GITHUB_WORKSPACE}/bin:${PATH}"
          export SECONDO_CONFIG="${GITHUB_WORKSPACE}/bin/SecondoConfig.ini"
          export SECONDO_PARAM_SecondoHome="${RUNNER_TEMP}/webui-dbs"
          mkdir -p "$SECONDO_PARAM_SecondoHome"
          cd bin
          printf 'create database berlintest;\nrestore database berlintest from berlintest;\nclose database;\nquit;\n' \
            | ./SecondoTTYBDB

      # -----------------------------------------------------------------------
      # Closes the loop the restore above opens: write the database back out and
      # require it to come back byte for byte.
      # -----------------------------------------------------------------------
      - name: Save the berlintest database and compare it with the original
        working-directory: bin
        run: |
          saved="${RUNNER_TEMP}/berlintest.saved"
          cat > "${RUNNER_TEMP}/save.sec" <<EOF
          open database berlintest;
          save database to '${saved}';
          close database;
          quit;
          EOF
          ./SecondoTTYBDB -i "${RUNNER_TEMP}/save.sec"
          cmp berlintest "$saved"

      - name: Start the SECONDO monitor
        working-directory: bin
        run: |
          echo "SECONDO_MONITOR_PIDFILE=${RUNNER_TEMP}/secondo-monitor.pid" \
            >> "$GITHUB_ENV"
          ./SecondoMonitor --daemon \
            --pidfile "${RUNNER_TEMP}/secondo-monitor.pid" \
            --log "${RUNNER_TEMP}/secondo-monitor.log"
          # Stricter than the port probe --daemon already did: this also
          # requires the registrar, which arbitrates database access, to
          # answer. The queries below need it.
          ./SecondoMonitor --health

      - name: Start the WebUI backend bridge
        working-directory: WebUI/backend
        run: |
          . .venv/bin/activate
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "${RUNNER_TEMP}/webui-backend.log" 2>&1 &
          echo "WEBUI_BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Query SECONDO through the REST interface
        run: |
          # Wait for the bridge to accept requests.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            if [ "$i" = 60 ]; then
              echo "Backend did not come up"; cat "${RUNNER_TEMP}/webui-backend.log"; exit 1
            fi
            sleep 1
          done

          # The first SECONDO command races the monitor's per-connection
          # server fork, so retry until the catalog lists BERLINTEST.
          echo "== /api/databases =="
          dbs=""
          for i in $(seq 1 30); do
            dbs=$(curl -sf http://127.0.0.1:8000/api/databases || true)
            if echo "$dbs" | grep -q BERLINTEST; then break; fi
            if [ "$i" = 30 ]; then
              echo "BERLINTEST not listed (last response: ${dbs:-<none>})"; exit 1
            fi
            sleep 1
          done
          echo "$dbs"

          # Open the database and run a real spatial query, keeping the session
          # cookie so both land on the same SECONDO connection.
          jar="${RUNNER_TEMP}/webui-cookies.txt"
          curl -sf -c "$jar" -b "$jar" -X POST http://127.0.0.1:8000/api/query \
            -H 'Content-Type: application/json' \
            -d '{"command":"open database berlintest"}' > /dev/null

          echo "== query mehringdamm =="
          res=$(curl -sf -c "$jar" -b "$jar" -X POST http://127.0.0.1:8000/api/query \
            -H 'Content-Type: application/json' \
            -d '{"command":"query mehringdamm"}')
          echo "$res"
          # The point value and its GeoJSON conversion must both be present.
          echo "$res" | grep -q '(point (9396.0 9871.0))'
          echo "$res" | grep -q '"geojson"'
          echo "SECONDO answered a query through the REST bridge."

      # -----------------------------------------------------------------------
      # The client library has to tolerate several connections in one process:
      # the WebUI bridge opens one per browser session and runs them in
      # parallel. Tests/csloadtest drives it from many threads and checks the
      # answers. Runs against the monitor started above. The same test runs
      # under ThreadSanitizer in the build-linux-tsan job, where both this
      # process and the server it talks to are instrumented.
      # -----------------------------------------------------------------------
      - name: Test concurrent client connections
        working-directory: Tests/csloadtest
        # This drives a server over a socket, so a wedged connection hangs
        # rather than fails.
        timeout-minutes: 10
        run: |
          make
          ./app --db berlintest --threads 10 --rounds 5 --expect-binary

      - name: Stop the WebUI stack
        if: always()
        run: |
          kill "${WEBUI_BACKEND_PID:-}" 2>/dev/null || true
          if [ -n "${SECONDO_MONITOR_PIDFILE:-}" ]; then
            SecondoMonitor --shutdown \
              --pidfile "${SECONDO_MONITOR_PIDFILE}" || true
          fi

      - name: Show WebUI logs on failure
        if: failure()
        run: |
          echo "########## SECONDO monitor"
          cat "${RUNNER_TEMP}/secondo-monitor.log" 2>/dev/null || true
          echo "########## WebUI backend"
          cat "${RUNNER_TEMP}/webui-backend.log" 2>/dev/null || true

   # ------------------------------------------------------------------------
   # The whole tree under ThreadSanitizer.
   #
   # This used to be two steps in build-linux that instrumented a hand-listed
   # mirror of the client library's sources -- NestedList, BigArray, SocketIO
   # and the CS interface, and nothing else. The QueryProcessor, every algebra
   # and the four server daemons were outside it, which is precisely where the
   # threads that serve users run. Instrumenting a subset is also the one thing
   # that makes TSan report races that do not exist, because it cannot see the
   # synchronization in the objects it was not compiled into.
   #
   # "make SECONDO_TSAN=1" (see makefile.env) instruments everything instead,
   # so the mirror and the guard that kept it from drifting are both gone. One
   # runner is enough: the sanitizer finds races in the code, not in the
   # platform, so running it on all three Ubuntu versions would cost three
   # times as much to learn the same thing.
   # ------------------------------------------------------------------------
   build-linux-tsan:
    runs-on: ubuntu-26.04
    env:
      # halt_on_error=0 so one run lists every race rather than only the first;
      # TSan still exits 66, which fails the step that produced it. history_size
      # trades memory for how far back the "previous access" stack can reach.
      # detect_deadlocks=0 because Berkeley DB takes its locks out of order on
      # purpose and resolves the result with its own deadlock detector -- that
      # is what DB_LOCK_DETECT is for. TSan cannot know that and reported every
      # occurrence: one restore of berlintest produced 20919 lock-order
      # inversions, all inside libdb_cxx, a 1.2 million line log, and not one
      # data race. Races are what this job is for, and they are still detected;
      # only the lock-order checker is off.
      TSAN_OPTIONS: >-
        halt_on_error=0
        history_size=4
        detect_deadlocks=0
        suppressions=${{ github.workspace }}/CM-Scripts/tsan.supp
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Its own key: -fsanitize=thread and -O1 change every command line, so
          # these objects would never hit the build-linux cache -- sharing a key
          # would only make the two jobs evict each other. Larger, too, because
          # instrumented objects are bigger.
          key: tsan-ubuntu-26.04
          max-size: 2G

      - name: Update packages
        run: |
          sudo apt-get update

      - name: Install packages
        run: |
          sudo apt-get -y install flex bison gcc g++ libdb5.3 libdb5.3-dev libdb5.3++ libdb5.3++-dev db5.3-util libjpeg-dev libgsl0-dev libreadline-dev librecode-dev libgmp-dev libncurses-dev libxml2-dev libboost-all-dev build-essential default-jdk wget swi-prolog-nox swi-prolog-java swi-prolog libquadmath0 libgmp-dev libgmp10 libboost-all-dev libbison-dev libfl-dev nlohmann-json3-dev

      - name: Detect SECONDO build environment
        run: |
          {
            echo "SECONDO_BUILD_DIR=${GITHUB_WORKSPACE}"
            echo "SECONDO_CC=ccache gcc"
            echo "SECONDO_CPP=ccache g++"
          } >> "$GITHUB_ENV"
          make -s -f makefile.detect print-vars
          make -f makefile.detect check-env

      - name: Show ccache statistics (before build)
        run: ccache -s

      # compileJava=false skips the Java GUI: javac never sees a sanitizer flag,
      # so building it here would only cost time.
      - name: Build SECONDO with ThreadSanitizer
        run: |
          make -j $(nproc) SECONDO_TSAN=1 compileJava=false

      - name: Show ccache statistics (after build)
        run: ccache -s

      # The top-level make does not build libsecondo.a, and Tests/csloadtest
      # links it.
      - name: Build the SECONDO client library
        run: make -C apis/api_cpp/cs SECONDO_TSAN=1

      # A binary that was never instrumented reports nothing and looks exactly
      # like a clean run, so check the server binaries carry TSan's calls before
      # trusting anything below. SecondoMonitor is the one the old job could not
      # reach at all.
      - name: Check that the server binaries are instrumented
        run: |
          rc=0
          for b in bin/SecondoMonitor bin/SecondoListener bin/SecondoRegistrar \
                   bin/SecondoCheckpoint bin/SecondoBDB bin/SecondoCS; do
            n=$(nm -C "$b" | grep -c __tsan_ || true)
            echo "$b: $n __tsan_ references"
            if [ "$n" -lt 10 ]; then
              echo "FAIL: $b is not instrumented"; rc=1
            fi
          done
          exit $rc

      - name: Test the nested list storage layer
        run: |
          make -C Tests tnestedlist SECONDO_TSAN=1
          Tests/tnestedlist

      - name: Test the BigArray chunked storage
        run: |
          make -C Tests tbigarray SECONDO_TSAN=1
          Tests/tbigarray

      # Several threads on one list, and one list handed from thread to thread.
      # Needs no server. Fewer threads and rounds than in build-linux: the
      # sanitizer is slow, and the races it looks for do not need a large
      # workload.
      - name: Test concurrent access to one nested list
        working-directory: Tests/csloadtest
        timeout-minutes: 30
        run: |
          make SECONDO_TSAN=1
          ./app --mode shared   --threads 4 --rounds 2 --list-mem 1
          ./app --mode handover --threads 4 --rounds 5 --list-mem 1

      - name: Restore the berlintest database
        run: |
          echo "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
          echo "SECONDO_CONFIG=${GITHUB_WORKSPACE}/bin/SecondoConfig.ini" >> "$GITHUB_ENV"
          echo "SECONDO_PARAM_SecondoHome=${RUNNER_TEMP}/tsan-dbs" >> "$GITHUB_ENV"
          export PATH="${GITHUB_WORKSPACE}/bin:${PATH}"
          export SECONDO_CONFIG="${GITHUB_WORKSPACE}/bin/SecondoConfig.ini"
          export SECONDO_PARAM_SecondoHome="${RUNNER_TEMP}/tsan-dbs"
          mkdir -p "$SECONDO_PARAM_SecondoHome"
          cd bin
          printf 'create database berlintest;\nrestore database berlintest from berlintest;\nclose database;\nquit;\n' \
            | ./SecondoTTYBDB

      # The replacement for the old app-tsan connection test, and strictly more
      # than it was: the client process and the server process on the other end
      # of the socket are now both instrumented.
      - name: Test concurrent client connections
        timeout-minutes: 30
        run: |
          cd bin
          ./SecondoMonitor --daemon \
            --pidfile "${RUNNER_TEMP}/secondo-monitor.pid" \
            --log "${RUNNER_TEMP}/secondo-monitor.log"
          ./SecondoMonitor --health
          cd ../Tests/csloadtest
          rc=0
          ./app --db berlintest --threads 4 --rounds 2 || rc=$?
          # Shut the monitor down before run-tests.sh, whose suites start
          # monitors of their own and expect the default port to be free.
          SecondoMonitor --shutdown \
            --pidfile "${RUNNER_TEMP}/secondo-monitor.pid" || true
          exit $rc

      # The .test suites and the .examples files are breadth over the operator
      # set, run in one process, and TSan has nothing to say about them -- they
      # would only multiply the job's run time. What is left is the part that
      # runs real SecondoMonitor process trees driven by parallel clients.
      # The optimizer is skipped because SecondoBDB embeds an uninstrumented
      # libswipl that threads, garbage-collects and shifts stacks on its own.
      - name: Test SECONDO
        run: |
          cd CM-Scripts/
          SECONDO_SKIP_TESTRUNNER_TESTS=true \
          SECONDO_SKIP_ALGEBRA_TESTS=true \
          SECONDO_SKIP_OPTIMIZER_TESTS=true \
            ./run-tests.sh -tty /tmp/secondotest-tsan 3600

      - name: Show failed test logs
        if: failure()
        run: |
          for f in "${GITHUB_WORKSPACE}"/bin/*.test.log; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done
          find /tmp/secondotest-tsan -type f 2>/dev/null | while read -r f; do
            echo "########## $f"; tail -80 "$f"
          done || true
          for d in "${TMPDIR:-/tmp}"/TestClientServer.* /tmp/TestClientServer.*; do
            [ -d "$d" ] || continue
            find "$d" -type f 2>/dev/null | while read -r f; do
              echo "########## $f"; tail -80 "$f"
            done
          done || true
          for f in "${GITHUB_WORKSPACE}"/bin/Checkpoint.msg \
                   "${GITHUB_WORKSPACE}"/bin/server.msg/* \
                   "${RUNNER_TEMP}/secondo-monitor.log"; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done || true

   build-macos:
    # Builds the C++ kernel + TTY, the Java GUI and the embedded-Prolog
    # optimizer engine, then runs the full test suite including the optimizer
    # test. The optimizer test drives SecondoBDB in "-pl" mode, which embeds
    # libswipl from the stock swi-prolog bottle -- no JPL, so no custom Prolog
    # build is needed.
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64, /usr/local); macos-15 / macos-26 =
        # Apple Silicon (arm64, /opt/homebrew).
        os: ['macos-15-intel', 'macos-15', 'macos-26']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.os }}-${{ runner.arch }}
          # See the note on the Linux job's ccache step above.
          max-size: 1G

      - name: Install Homebrew packages
        run: |
          brew update
          # Build tools + the external components the SDK used to provide. The
          # embedded optimizer links libswipl from the stock swi-prolog bottle;
          # no JPL and no custom Prolog build are needed anymore.
          brew install flex bison berkeley-db gsl jpeg-turbo boost gmp \
                       libxml2 readline nlohmann-json swi-prolog

      - name: Install Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Put keg-only build tools on PATH
        run: |
          # Homebrew's flex/bison are keg-only; the makefiles call them by name.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"

      - name: Detect SECONDO build environment
        run: |
          # As on Linux: makefile.detect resolves the platform, Prolog, the JDK,
          # Berkeley DB and the keg-only Homebrew prefixes during the build, and
          # exports LIBRARY_PATH (the link-time Homebrew lib dirs) itself.
          {
            echo "SECONDO_BUILD_DIR=${GITHUB_WORKSPACE}"
            echo "SECONDO_CC=ccache clang"
            echo "SECONDO_CPP=ccache clang++"
          } >> "$GITHUB_ENV"
          make -s -f makefile.detect print-vars
          make -f makefile.detect check-env

      - name: Show ccache statistics (before build)
        run: ccache -s

      - name: Build SECONDO
        run: |
          make -j $(sysctl -n hw.ncpu)

      - name: Show ccache statistics (after build)
        run: ccache -s

      # The C++ unit tests are not part of `make`, and run-tests.sh below only
      # drives the TTY level suites -- so nothing was exercising the nested list
      # storage layer directly. tnestedlist covers the atom types, CopyList and
      # the ToString round trip, and exits with its error count.
      - name: Test the nested list storage layer
        run: |
          make -C Tests tnestedlist
          Tests/tnestedlist

      # BigArray is what NestedList stores its tables in, and tnestedlist never
      # grows one far enough to leave its first chunk. tbigarray does, and
      # checks the invariant the class is built around: a chunk, once mapped,
      # is never moved -- which is what lets a reader dereference an element
      # while another thread appends.
      - name: Test the BigArray chunked storage
        run: |
          make -C Tests tbigarray
          Tests/tbigarray

      - name: Test SECONDO
        run: |
          cd CM-Scripts/; ./run-tests.sh -tty /tmp/secondotest 3600

      - name: Show failed test logs
        if: failure()
        run: |
          for f in "${GITHUB_WORKSPACE}"/bin/*.test.log; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done
          find /tmp/secondotest -type f 2>/dev/null | while read -r f; do
            echo "########## $f"; tail -80 "$f"
          done || true
          # TestClientServer runs from a mktemp -d and normally removes it, so
          # anything left here is from a run that was killed before its trap
          # could fire -- a hung shutdown. That leftover monitor.log names the
          # call the monitor or checkpoint service was wedged in, and it is the
          # one artifact that was missing when this last happened.
          for d in "${TMPDIR:-/tmp}"/TestClientServer.* /tmp/TestClientServer.*; do
            [ -d "$d" ] || continue
            find "$d" -type f 2>/dev/null | while read -r f; do
              echo "########## $f"; tail -80 "$f"
            done
          done || true
          # The daemons the monitor spawns log to their own cwd, which is bin/,
          # not to the test's temporary home -- so none of the loops above sees
          # them. Checkpoint.msg is the only record of what the checkpoint
          # service was doing when it ignored a shutdown request, and
          # server.msg/ holds the per-client server output.
          for f in "${GITHUB_WORKSPACE}"/bin/Checkpoint.msg \
                   "${GITHUB_WORKSPACE}"/bin/server.msg/*; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done || true
