name: Build and test SECONDO 

on:
  push:
    branches: [main]
  pull_request:

jobs:
   build:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04', 'ubuntu-26.04']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.os }}

      - name: Update packages
        run: |
          sudo apt-get update

      - name: Install packages
        run: |
          sudo apt-get -y install flex bison gcc g++ libdb5.3 libdb5.3-dev libdb5.3++ libdb5.3++-dev db5.3-util libjpeg62 libjpeg62-dev libgsl0-dev libreadline-dev librecode-dev libgmp-dev libncurses-dev libxml2-dev libboost-all-dev build-essential openjdk-8-jdk wget swi-prolog-nox swi-prolog-java swi-prolog libquadmath0 libgmp-dev libgmp10 original-awk libboost-all-dev libbison-dev libfl-dev

      - name: Detect SECONDO build environment
        run: |
          # Prolog paths/version, Berkeley DB and platform are derived from the
          # installed tools by secondo-detect.sh.
          export SECONDO_BUILD_DIR="${GITHUB_WORKSPACE}"
          export SECONDO_CC="ccache gcc"
          export SECONDO_CPP="ccache g++"
          ./CM-Scripts/secondo-detect.sh --print-vars
          {
            echo "SECONDO_CC=${SECONDO_CC}"
            echo "SECONDO_CPP=${SECONDO_CPP}"
            ./CM-Scripts/secondo-detect.sh --print-vars
          } >> "$GITHUB_ENV"

      - name: Show ccache statistics (before build)
        run: ccache -s

      - name: Build SECONDO
        run: |
          cp -av makefile.algebras.cibuild makefile.algebras
          make -j $(nproc)

      - name: Show ccache statistics (after build)
        run: ccache -s

      - name: Test SECONDO
        run: |
          cd CM-Scripts/; ./run-tests.sh -tty /tmp/secondotest 12000
  
