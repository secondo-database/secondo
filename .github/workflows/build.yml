name: Build and test SECONDO

on:
  push:
    branches: [main]
  pull_request:

jobs:
   build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04', 'ubuntu-26.04']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.os }}

      - name: Update packages
        run: |
          sudo apt-get update

      - name: Install packages
        run: |
          sudo apt-get -y install flex bison gcc g++ libdb5.3 libdb5.3-dev libdb5.3++ libdb5.3++-dev db5.3-util libjpeg-dev libgsl0-dev libreadline-dev librecode-dev libgmp-dev libncurses-dev libxml2-dev libboost-all-dev build-essential default-jdk wget swi-prolog-nox swi-prolog-java swi-prolog libquadmath0 libgmp-dev libgmp10 libboost-all-dev libbison-dev libfl-dev nlohmann-json3-dev

      - name: Detect SECONDO build environment
        run: |
          # Prolog paths/version, Berkeley DB and platform are derived from the
          # installed tools by secondo-detect.sh.
          export SECONDO_BUILD_DIR="${GITHUB_WORKSPACE}"
          export SECONDO_CC="ccache gcc"
          export SECONDO_CPP="ccache g++"
          ./CM-Scripts/secondo-detect.sh --print-vars
          ./CM-Scripts/secondo-detect.sh --check
          {
            echo "SECONDO_CC=${SECONDO_CC}"
            echo "SECONDO_CPP=${SECONDO_CPP}"
            ./CM-Scripts/secondo-detect.sh --print-vars
          } >> "$GITHUB_ENV"

      - name: Show ccache statistics (before build)
        run: ccache -s

      - name: Build SECONDO
        run: |
          make -j $(nproc)

      - name: Show ccache statistics (after build)
        run: ccache -s

      - name: Test SECONDO
        run: |
          cd CM-Scripts/; ./run-tests.sh -tty /tmp/secondotest 12000

      - name: Show failed test logs
        if: failure()
        run: |
          for f in "${GITHUB_WORKSPACE}"/bin/*.test.log; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done
          find /tmp/secondotest -type f 2>/dev/null | while read -r f; do
            echo "########## $f"; tail -80 "$f"
          done || true

   build-macos:
    # Builds the C++ kernel + TTY, the Java GUI, the embedded-Prolog optimizer
    # engine and the JPL optimizer server (OptServer), then runs the full test
    # suite including the optimizer test. The optimizer test drives SecondoBDB in
    # "-pl" mode (embeds libswipl, no JPL); OptServer uses JPL, which is why the
    # Install step rebuilds swi-prolog from source with the Java package on.
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64, /usr/local); macos-15 / macos-26 =
        # Apple Silicon (arm64, /opt/homebrew).
        os: ['macos-15-intel', 'macos-15', 'macos-26']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.os }}-${{ runner.arch }}

      - name: Install Homebrew packages
        run: |
          brew update
          # Build tools + the external components the SDK used to provide.
          brew install flex bison berkeley-db gsl jpeg-turbo boost gmp \
                       libxml2 readline nlohmann-json
          # JPL is built against openjdk@21 -- the SAME major version as the
          # Temurin JDK below that compiles OptimizerServer.java.
          brew install openjdk@21
          # swi-prolog's own dependencies come from bottles and are cheap; only
          # the keg itself is expensive to build, and that one is cached below.
          brew install --only-dependencies swi-prolog
          # The Cellar path is /opt/homebrew on arm64 and /usr/local on Intel.
          echo "SWIPL_CELLAR=$(brew --cellar)/swi-prolog" >> "$GITHUB_ENV"
          echo "SWIPL_VERSION=$(brew info --json=v2 swi-prolog |
                jq -r '.formulae[0].versions.stable')" >> "$GITHUB_ENV"

      # Building swi-prolog from source takes several minutes, so keep the
      # finished keg.
      - name: Cache swi-prolog (built with JPL)
        id: swipl-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SWIPL_CELLAR }}
          key: swipl-jpl-${{ matrix.os }}-${{ runner.arch }}-${{ env.SWIPL_VERSION }}-v1

      - name: Build swi-prolog with JPL
        if: steps.swipl-cache.outputs.cache-hit != 'true'
        run: |
          # The stock swi-prolog bottle is built with -DSWIPL_PACKAGES_JAVA=OFF,
          # so it ships no jpl.jar / libjpl.dylib which the JPL optimizer
          # server (OptServer) needs. Editing the formula requires the real
          # homebrew/core tap rather than the API.
          export HOMEBREW_NO_INSTALL_FROM_API=1
          brew tap homebrew/core
          formula="$(brew formula swi-prolog)"
          echo "Editing formula: $formula"
          sed -i '' 's/-DSWIPL_PACKAGES_JAVA=OFF/-DSWIPL_PACKAGES_JAVA=ON/' "$formula"
          sed -i '' 's/^  def install/  depends_on "openjdk@21" => :build\n  def install/' "$formula"
          grep -nE 'SWIPL_PACKAGES_JAVA|openjdk' "$formula"
          brew install --build-from-source swi-prolog

      - name: Link cached swi-prolog
        if: steps.swipl-cache.outputs.cache-hit == 'true'
        run: |
          # The cache restores the keg, but not its symlinks into the prefix.
          brew link --overwrite swi-prolog

      - name: Verify that JPL is present
        run: |
          # Guards both the fresh build and a stale/corrupt cache entry.
          plbase="$(swipl --dump-runtime-variables | sed -n 's/^PLBASE="\(.*\)";/\1/p')"
          ls -l "$plbase/lib/jpl.jar"
          find "$plbase" -name 'libjpl.*' -print

      - name: Install Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Put keg-only build tools on PATH
        run: |
          # Homebrew's flex/bison are keg-only; the makefiles call them by name.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"

      - name: Detect SECONDO build environment
        run: |
          export SECONDO_BUILD_DIR="${GITHUB_WORKSPACE}"
          export SECONDO_CC="ccache clang"
          export SECONDO_CPP="ccache clang++"
          # Source it so LIBRARY_PATH (link-time Homebrew lib dirs) is set here.
          source ./CM-Scripts/secondo-detect.sh
          ./CM-Scripts/secondo-detect.sh --print-vars
          ./CM-Scripts/secondo-detect.sh --check
          {
            echo "SECONDO_CC=${SECONDO_CC}"
            echo "SECONDO_CPP=${SECONDO_CPP}"
            ./CM-Scripts/secondo-detect.sh --print-vars
            [ -n "${LIBRARY_PATH:-}" ] && echo "LIBRARY_PATH=${LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Show ccache statistics (before build)
        run: ccache -s

      - name: Build SECONDO
        run: |
          make -j $(sysctl -n hw.ncpu)

      - name: Show ccache statistics (after build)
        run: ccache -s

      - name: Test SECONDO
        run: |
          cd CM-Scripts/; ./run-tests.sh -tty /tmp/secondotest 3600

      - name: Show failed test logs
        if: failure()
        run: |
          for f in "${GITHUB_WORKSPACE}"/bin/*.test.log; do
            [ -f "$f" ] || continue
            echo "########## $f"; tail -80 "$f"
          done
          find /tmp/secondotest -type f 2>/dev/null | while read -r f; do
            echo "########## $f"; tail -80 "$f"
          done || true
